# Server: hosting providers (e.g. Render) assign the port via $PORT.
# Local default remains http://localhost:8080.
server.port=${PORT:8080}

# H2 file-based database (persists across restarts in ./data directory,
# relative to the backend folder when started from there).
# Override the path in production with TODO_DB_PATH (must point at
# persistent writable storage, otherwise restarts lose data).
spring.datasource.url=jdbc:h2:file:${TODO_DB_PATH:./data/tododb};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA: create tables automatically for local development
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 console (local dev only, default sa user with blank password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS: comma-separated allowed-origin patterns for the standalone frontend.
# Local default allows everything (single-user dev app, no credentials).
# In production set TODO_CORS_PATTERNS to the real frontend domain,
# e.g. TODO_CORS_PATTERNS=https://todo-frontend.vercel.app
app.cors.allowed-patterns=${TODO_CORS_PATTERNS:*}

# Jackson date formats
spring.jackson.serialization.write-dates-as-timestamps=false
